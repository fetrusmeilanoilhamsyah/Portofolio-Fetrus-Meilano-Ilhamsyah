server {
    listen 80;
    listen [::]:80;
    server_name example.com; # GANTI dengan domain Anda

    # Mengalihkan semua HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com; # GANTI dengan domain Anda

    ssl_certificate     /etc/ssl/cloudflare/portofolio.pem;
    ssl_certificate_key /etc/ssl/cloudflare/portofolio.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/portofolio/public;

    index index.php;

    charset utf-8;

    # Batas ukuran unggahan (Video 8MB, Livewire 10MB)
    client_max_body_size 12m;

    # Cloudflare Real IP (Opsional, buka komentar jika pakai Cloudflare proxy)
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blokir akses ke file PHP di dalam storage
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache lama untuk file statis
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri /index.php?$query_string;
    }

    # Pastikan file dalam storage mengembalikan Content-Type yang benar
    location /storage/ {
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    # Hanya jalankan file index.php
    location ~ ^/index\.php(/|$) {
        # Pastikan tidak tumpang tindih dengan bot/webhook lain
        fastcgi_pass unix:/run/php/php-fpm-portfolio.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Blokir akses langsung ke file PHP lainnya
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
